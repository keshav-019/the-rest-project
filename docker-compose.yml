services:
  app:
    container_name: the-rest-project
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "1500"
      HOSTNAME: "0.0.0.0"
      RUNNING_IN_DOCKER: "true"
      DOCKER_HOST_ALIAS: "host.docker.internal"
    ports:
      - "1500:1500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
